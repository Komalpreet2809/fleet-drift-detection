version: '3.8'

# ==============================================================================
# INT333: Docker Compose Environment for Local Testing & Live Demo
# Allows 1-click execution on any laptop running Docker.
# ==============================================================================

services:
  webapp:
    image: python:3.10-slim
    container_name: int333_webapp
    working_dir: /app
    volumes:
      - ./ansible/roles/webapp/files:/app
    command: >
      bash -c "pip install --no-cache-dir flask &&
               python app.py"
    ports:
      - "5000:5000"
    networks:
      - devops_net

  nagios:
    image: jasonrivers/nagios:latest
    container_name: int333_nagios
    ports:
      - "8080:80"
    volumes:
      - ./nagios/sample_configs/hosts.cfg:/opt/nagios/etc/objects/hosts.cfg:ro
      - ./nagios/sample_configs/services.cfg:/opt/nagios/etc/objects/services.cfg:ro
      - ./nagios/sample_configs/commands.cfg:/opt/nagios/etc/objects/custom_commands.cfg:ro
      - ./ansible/roles/nagios/files/plugins/check_webapp_health.py:/opt/nagios/libexec/check_webapp_health.py:ro
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=admin123
    depends_on:
      - webapp
    networks:
      - devops_net

networks:
  devops_net:
    driver: bridge
