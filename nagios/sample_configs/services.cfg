###############################################################################
# NAGIOS OBJECT DEFINITIONS: SERVICES
# Active and Passive service checks for INT333
###############################################################################

# 1. ICMP Ping check to confirm basic network reachability
define service {
    use                     generic-service
    host_name               web-server-01
    service_description     Host Ping Reachability
    check_command           check-host-alive
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_period     24x7
}

# 2. HTTP Port check
define service {
    use                     generic-service
    host_name               web-server-01
    service_description     HTTP Web UI Availability
    check_command           check_http_port!5000!/
    check_interval          1
    retry_interval          1
    max_check_attempts      2
}

# 3. Custom Python Plugin Deep Health Check
define service {
    use                     generic-service
    host_name               web-server-01
    service_description     Microservice Health & Latency
    check_command           check_webapp_custom!5000!/health
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    notification_interval   5
}
