###############################################################################
# NAGIOS OBJECT DEFINITIONS: HOSTS
# Target nodes monitored by Nagios Core
###############################################################################

define host {
    use                     linux-server
    host_name               web-server-01
    alias                   Production Web Application Server
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   10
    notification_period     24x7
    notifications_enabled   1
}
