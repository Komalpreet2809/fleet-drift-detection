---
# ==============================================================================
# INT333 Master Deployment Playbook
# Orchestrates Common Base, Web Application, and Nagios Continuous Monitoring
# ==============================================================================

- name: Phase 1 - Baseline System Hardening & Packages
  hosts: all
  roles:
    - role: common
      tags: [common, baseline]

- name: Phase 2 - Deploy Multi-Tier Web Application
  hosts: webservers
  roles:
    - role: webapp
      tags: [webapp, app]

- name: Phase 3 - Configure Nagios Monitoring & Custom Plugins
  hosts: monitoring
  roles:
    - role: nagios
      tags: [nagios, monitoring]
