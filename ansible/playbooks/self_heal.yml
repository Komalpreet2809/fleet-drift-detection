---
# ==============================================================================
# INT333: Automated Self-Healing & Incident Remediation Playbook
# Fulfills Rubric: Functionality & Automation (10 marks) & Innovation (5 marks)
# Triggered when Nagios alerts on unhealthy status or during live demo
# ==============================================================================

- name: Self-Healing & Service Remediation
  hosts: webservers
  tasks:
    - name: Diagnose: Check if Web Application is responding
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port | default(5000) }}/health"
        status_code: 200
        timeout: 3
      register: health_check
      ignore_errors: true

    - name: Display Diagnosis Result
      ansible.builtin.debug:
        msg: >
          {{ 'Service is currently UNHEALTHY. Initiating automated recovery...' 
             if health_check.failed 
             else 'Service is HEALTHY.' }}

    - name: Action: Hit /recover API endpoint to reset simulated failure
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port | default(5000) }}/recover"
        method: POST
        status_code: [200, 404]
      when: health_check.failed
      ignore_errors: true

    - name: Action: Restart web application service if crashed
      ansible.builtin.service:
        name: "{{ service_name | default('devops-webapp') }}"
        state: restarted
      when: health_check.failed
      ignore_errors: true

    - name: Verify: Confirm service recovery
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port | default(5000) }}/health"
        status_code: 200
        timeout: 5
      register: verify_recovery
      retries: 3
      delay: 2
      until: verify_recovery.status == 200
      ignore_errors: true

    - name: Recovery Complete Notification
      ansible.builtin.debug:
        msg: "Automated Self-Healing Successful! Nagios checks will transition from CRITICAL to OK."
