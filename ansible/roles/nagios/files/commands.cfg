###############################################################################
# INT333: Nagios Command Definitions
# Defines execution syntax for core and custom monitoring plugins
###############################################################################

# Standard Ping / Host Alive Check
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Standard HTTP Check
define command {
    command_name    check_http_port
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$
}

# Custom Python Health Check Plugin (INT333 Practical 8 & Innovation)
define command {
    command_name    check_webapp_custom
    command_line    /usr/bin/python3 $USER1$/check_webapp_health.py -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -w 1.0 -c 2.5
}
