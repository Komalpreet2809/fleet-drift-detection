# INT333 DevOps Project Inventory File
# This file is dynamically populated by Terraform, or can be run locally

[webservers]
web1 ansible_host=127.0.0.1 ansible_connection=local app_port=5000

[monitoring]
nagios1 ansible_host=127.0.0.1 ansible_connection=local nagios_port=8080

[all:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=dev
project_name=int333-devops
admin_email=admin@example.com
