---
# Configuration for Nagios Core Monitoring Node
nagios_user: "nagios"
nagios_group: "nagios"
nagios_web_port: 8080
nagios_config_dir: "/usr/local/nagios/etc"
nagios_plugins_dir: "/usr/local/nagios/libexec"
check_interval_mins: 1
retry_interval_mins: 1
notification_interval_mins: 10
notification_period: "24x7"
monitored_hosts:
  - name: "web1"
    alias: "Production Web Server"
    address: "127.0.0.1"
    check_command: "check-host-alive"
